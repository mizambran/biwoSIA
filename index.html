<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Precios Online</title>
    <!-- Incluyendo Tailwind CSS para un diseño moderno y responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS proporcionado por el usuario, ahora inmerso para que sea un solo archivo */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Usando la fuente Inter para un look más limpio */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Estilo para el indicador de carga */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4f46e5;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-100">

    <div class="w-full max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <!-- Encabezado -->
            <div class="p-6 bg-gray-50 border-b border-gray-200">
                <h1 class="text-2xl font-bold text-gray-800">Buscador de Precios Online</h1>
                <p class="mt-1 text-sm text-gray-600">Ingresa un producto para buscar precios, vendedores y enlaces en Argentina.</p>
            </div>

            <!-- Formulario de búsqueda -->
            <div class="p-6">
                <form id="search-form" class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="product-search" name="product-search" placeholder="Ej: Coca-Cola 2.25L" class="flex-grow block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" required>
                    <button type="submit" class="w-full sm:w-auto inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                        Buscar Precios
                    </button>
                </form>
            </div>

            <!-- Contenedor de Resultados -->
            <div id="results-container" class="p-6 bg-white">
                <!-- El mensaje inicial, el loader y los resultados se mostrarán aquí -->
                <div id="initial-message" class="text-center text-gray-500 py-10">
                    <p>Los resultados de tu búsqueda aparecerán aquí.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Referencias a los elementos del DOM ---
        const searchForm = document.getElementById('search-form');
        const productSearchInput = document.getElementById('product-search');
        const resultsContainer = document.getElementById('results-container');
        const initialMessage = document.getElementById('initial-message');

        // --- ¡IMPORTANTE! Configura tu API Key aquí ---
        // 1. Obtén tu clave de API desde Google AI Studio: https://aistudio.google.com/app/apikey
        // 2. Pega la clave de API entre las comillas.
        const apiKey = "AIzaSyB2GuADuiENpiy0H5UIlf0JHi8gclZpJiM";
        
        // --- Función para mostrar el indicador de carga ---
        function showLoader() {
            resultsContainer.innerHTML = '<div class="flex justify-center py-10"><div class="loader"></div></div>';
        }

        // --- Función para mostrar los resultados ---
        function displayResults(products) {
            resultsContainer.innerHTML = ''; // Limpiar resultados anteriores
            if (!products || products.length === 0) {
                resultsContainer.innerHTML = '<p class="text-center text-gray-500 py-10">No se encontraron resultados para tu búsqueda.</p>';
                return;
            }

            const resultsList = document.createElement('div');
            resultsList.className = 'space-y-4';

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'p-4 border rounded-lg hover:shadow-md transition-shadow';

                const productName = document.createElement('h3');
                productName.className = 'text-lg font-semibold text-gray-800';
                productName.textContent = product.producto || 'Producto no especificado';

                const seller = document.createElement('p');
                seller.className = 'text-sm text-gray-600';
                seller.textContent = `Vendido por: ${product.vendedor || 'Vendedor no especificado'}`;

                const price = document.createElement('p');
                price.className = 'text-lg font-bold text-indigo-600 mt-2';
                price.textContent = product.precio || 'Precio no disponible';

                const link = document.createElement('a');
                link.href = product.enlace || '#';
                link.textContent = 'Ir al sitio web';
                link.target = '_blank'; // Abrir en nueva pestaña
                link.rel = 'noopener noreferrer';
                link.className = 'inline-block mt-3 text-sm font-medium text-indigo-500 hover:text-indigo-700';
                
                link.innerHTML += ' &rarr;';

                card.appendChild(productName);
                card.appendChild(seller);
                card.appendChild(price);
                if(product.enlace) {
                    card.appendChild(link);
                }

                resultsList.appendChild(card);
            });

            resultsContainer.appendChild(resultsList);
        }
        
        // --- Función para mostrar errores ---
        function displayError(message) {
            resultsContainer.innerHTML = `<p class="text-center text-red-500 py-10">${message}</p>`;
        }


        // --- Event Listener para el formulario de búsqueda ---
        searchForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            const searchTerm = productSearchInput.value.trim();
            if (!searchTerm) return;

            // Validación de la API Key: Muestra un error si no se ha configurado
            if (!apiKey || apiKey === "") {
                displayError("Error: Por favor, configura tu API key en la variable 'apiKey' dentro del código HTML.");
                return;
            }
            
            showLoader();
            
            const prompt = `Busca en internet precios para el producto "${searchTerm}" que se vendan en Argentina. Devuelve una lista de resultados.`;

            // Configuración del payload para la API
            const payload = {
                contents: [{ role: "user", parts: [{ text: prompt }] }],
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "ARRAY",
                        items: {
                            type: "OBJECT",
                            properties: {
                                "producto": { "type": "STRING", "description": "Nombre completo del producto encontrado." },
                                "vendedor": { "type": "STRING", "description": "Nombre de la tienda o supermercado que lo vende." },
                                "precio": { "type": "STRING", "description": "Precio del producto con su moneda." },
                                "enlace": { "type": "STRING", "description": "URL directa a la página del producto." }
                            },
                            required: ["producto", "vendedor", "precio", "enlace"]
                        }
                    }
                }
            };
            
            // Lógica para reintentos con exponential backoff
            const maxRetries = 3;
            let currentRetry = 0;
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

            while (currentRetry < maxRetries) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!response.ok) {
                        if (response.status === 429) { // Demasiadas solicitudes
                            currentRetry++;
                            const delay = Math.pow(2, currentRetry) * 1000;
                            console.log(`Rate limit exceeded. Retrying in ${delay}ms...`);
                            await new Promise(resolve => setTimeout(resolve, delay));
                            continue;
                        } else {
                            throw new Error(`Error en la API: ${response.statusText}`);
                        }
                    }

                    const result = await response.json();
                    const textPart = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (textPart) {
                        const products = JSON.parse(textPart);
                        displayResults(products);
                        return; // Salir del bucle si es exitoso
                    } else {
                        throw new Error("No se pudo obtener una respuesta válida del modelo.");
                    }

                } catch (error) {
                    console.error('Error al buscar precios:', error);
                    currentRetry++;
                    if (currentRetry >= maxRetries) {
                        displayError('Ocurrió un error al buscar los precios. Por favor, intenta de nuevo.');
                        return;
                    }
                }
            }
        });
    </script>

</body>
</html>
